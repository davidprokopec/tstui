name: release-please
on:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  release-please:
    if: ${{ false }} # M5 gate: intentionally inert until release validation exists.
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
